<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorer Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg: #FAF5EA;
    --grid: rgba(3, 105, 161, 0.055);
    --surface: #FFFFFF;
    --ink: #2B2416;
    --muted: #7A6D55;
    --accent: #0369A1;
    --accent-soft: rgba(3, 105, 161, 0.10);
    --on-accent: #FFFFFF;
    --good: #1E8A4C;
    --good-soft: rgba(30, 138, 76, 0.12);
    --bad: #D23B3B;
    --bad-soft: rgba(210, 59, 59, 0.10);
    --line: #E8DCC4;
    --shadow: 0 2px 10px rgba(43, 36, 22, 0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101A22;
      --grid: rgba(79, 182, 232, 0.05);
      --surface: #182631;
      --ink: #EAF1F4;
      --muted: #9BB0BA;
      --accent: #4FB6E8;
      --accent-soft: rgba(79, 182, 232, 0.15);
      --on-accent: #0E1A22;
      --good: #4CC97E;
      --good-soft: rgba(76, 201, 126, 0.14);
      --bad: #F07A7A;
      --bad-soft: rgba(240, 122, 122, 0.13);
      --line: #243845;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #101A22;
    --grid: rgba(79, 182, 232, 0.05);
    --surface: #182631;
    --ink: #EAF1F4;
    --muted: #9BB0BA;
    --accent: #4FB6E8;
    --accent-soft: rgba(79, 182, 232, 0.15);
    --on-accent: #0E1A22;
    --good: #4CC97E;
    --good-soft: rgba(76, 201, 126, 0.14);
    --bad: #F07A7A;
    --bad-soft: rgba(240, 122, 122, 0.13);
    --line: #243845;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    background:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px),
      var(--bg);
    background-size: 28px 28px, 28px 28px, auto;
    font-family: "Atkinson Hyperlegible", "Avenir Next", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 620px; margin: 0 auto; padding: 18px 14px 48px; }

  h1, h2, h3 { font-family: "Baloo 2", "Avenir Next", system-ui, sans-serif; text-wrap: balance; margin: 0; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }

  .topbar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 4px 2px 14px; }
  .brand { font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.01em; }
  .brand span { color: var(--accent); }
  .navlink {
    background: none; border: none; padding: 4px 2px; cursor: pointer;
    color: var(--accent); font: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px;
  }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 20px 18px; margin-bottom: 14px; }

  .hero h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.015em; line-height: 1.15; }
  .hero p { color: var(--muted); margin: 10px 0 0; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; text-align: center;
    font: inherit; font-weight: 700; cursor: pointer;
    border-radius: 12px; padding: 13px 20px; min-height: 52px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    touch-action: manipulation;
  }
  .btn:focus-visible, .navlink:focus-visible, input:focus-visible, details summary:focus-visible, .opt:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-size: 17px; }
  .btn-wide { width: 100%; }
  .btn-danger { color: var(--bad); }
  .btn-row { display: flex; gap: 10px; margin-top: 16px; }
  .btn-row .btn { flex: 1; }
  .btn small { display: block; font-weight: 400; font-size: 12.5px; opacity: 0.85; }
  .btn .stack { display: block; }

  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 4px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; }
  .stat .num { font-family: "IBM Plex Mono", monospace; font-size: 23px; font-weight: 600; }
  .stat .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }

  /* ---------- Quiz ---------- */
  .progress { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0 10px; }
  .progress .label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
  .bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bar > div { height: 100%; border-radius: 999px; background: var(--accent); transition: width 0.25s ease; }
  @media (prefers-reduced-motion: reduce) { .bar > div { transition: none; } }

  .qtopic { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin-bottom: 8px; }
  .qterm { font-family: "Baloo 2", system-ui, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.01em; margin: 2px 0 4px; }
  .qtext { font-size: 17.5px; margin: 0 0 6px; }
  .qsub { font-weight: 700; font-size: 15px; color: var(--muted); margin: 0 0 12px; }
  .figbox { display: flex; justify-content: center; margin: 8px 0 12px; }
  .figbox svg { max-width: 100%; height: auto; }

  /* map */
  .m-land { fill: var(--line); fill-opacity: 0.65; stroke: var(--ink); stroke-width: 1.3; stroke-linejoin: round; }
  .m-hi { fill: var(--accent); fill-opacity: 0.55; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
  .m-river { stroke: var(--accent); stroke-width: 2; fill: none; stroke-linecap: round; opacity: 0.75; }
  .m-ring { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 5 4; }
  .m-label { font: 700 9px "Atkinson Hyperlegible", sans-serif; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 2.5px; }
  .m-rlabel { font: 600 8px "Atkinson Hyperlegible", sans-serif; fill: var(--accent); paint-order: stroke; stroke: var(--surface); stroke-width: 2px; }
  .m-lead { stroke: var(--muted); stroke-width: 0.8; fill: none; }

  .opts { display: flex; flex-direction: column; gap: 9px; }
  .opt {
    font: inherit; font-size: 15.5px; font-weight: 700; text-align: left; cursor: pointer;
    border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink);
    padding: 13px 14px; min-height: 52px; touch-action: manipulation;
  }
  .opt.right { border-color: var(--good); background: var(--good-soft); color: var(--good); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
  .opt:disabled { cursor: default; opacity: 1; }
  .opt.dim:disabled { opacity: 0.55; }

  .answer-line { display: flex; gap: 8px; align-items: center; }
  input.answer {
    flex: 1; width: 100%; min-height: 54px; padding: 8px 14px;
    font-family: "IBM Plex Mono", monospace; font-size: 20px; font-weight: 600;
    color: var(--ink); background: var(--surface);
    border: 2px solid var(--line); border-radius: 12px;
  }
  input.answer::placeholder { color: var(--muted); opacity: 0.6; font-weight: 500; font-size: 15px; font-family: "Atkinson Hyperlegible", sans-serif; }
  .answer-line .btn { flex: 0 0 auto; }

  .feedback { min-height: 46px; border-radius: 10px; padding: 10px 12px; font-size: 15px; margin-top: 12px; }
  .feedback.neutral { color: var(--muted); background: var(--surface); border: 1px dashed var(--line); }
  .feedback.right { color: var(--good); background: var(--good-soft); font-weight: 700; }
  .feedback.wrong { color: var(--bad); background: var(--bad-soft); font-weight: 700; }
  .feedback .why { display: block; font-weight: 400; color: var(--ink); margin-top: 4px; }

  /* ---------- Results / history / study ---------- */
  .score-hero { text-align: center; padding: 26px 18px; }
  .score-big { font-family: "IBM Plex Mono", monospace; font-size: 54px; font-weight: 600; line-height: 1; }
  .score-msg { font-family: "Baloo 2", system-ui, sans-serif; font-size: 22px; font-weight: 800; margin-top: 10px; }
  .score-sub { color: var(--muted); margin-top: 4px; }

  .misslist { margin: 0; padding: 0; list-style: none; }
  .misslist li { padding: 10px 4px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .misslist li:last-child { border-bottom: none; }
  .misslist .q { font-weight: 700; display: block; }
  .misslist .a { color: var(--bad); font-family: "IBM Plex Mono", monospace; }
  .misslist .cor { color: var(--good); font-weight: 700; }
  .allgood { color: var(--good); font-weight: 700; padding: 10px 4px; }

  .hrow { border-bottom: 1px solid var(--line); }
  .hrow:last-child { border-bottom: none; }
  .hrow summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 4px; cursor: pointer; list-style: none; }
  .hrow summary::-webkit-details-marker { display: none; }
  .hdate { font-size: 15px; flex: 1; }
  .hdate small { display: block; color: var(--muted); }
  .hscope { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 3px 9px; }
  .hscore { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 14px; color: var(--muted); }
  .hpct { font-family: "IBM Plex Mono", monospace; font-weight: 600; border-radius: 999px; padding: 4px 11px; font-size: 14px; }
  .pct-good { color: var(--good); background: var(--good-soft); }
  .pct-mid  { color: var(--accent); background: var(--accent-soft); }
  .pct-low  { color: var(--bad); background: var(--bad-soft); }
  .hdetail { padding: 0 4px 12px; }

  .trouble .tlabel { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; margin-bottom: 3px; }
  .trouble .tlabel .mono { color: var(--muted); font-weight: 600; font-size: 13px; }
  .tbar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; margin-bottom: 9px; }
  .tbar > div { height: 100%; border-radius: 999px; background: var(--bad); }

  .study h3 { font-size: 18px; margin: 18px 0 8px; color: var(--accent); }
  .study h3:first-of-type { margin-top: 0; }
  .word { border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; margin-bottom: 9px; background: var(--surface); }
  .word .wt { font-weight: 800; font-family: "Baloo 2", system-ui, sans-serif; font-size: 17px; }
  .word .wd { margin: 3px 0 0; font-size: 15.5px; }
  .word .wn { margin: 5px 0 0; font-size: 13.5px; color: var(--muted); }
  .word .wn b { color: var(--accent); }
  .study ul { margin: 0 0 4px; padding-left: 20px; }
  .study li { margin-bottom: 6px; font-size: 15.5px; }
  .study b { color: var(--accent); }

  .empty { color: var(--muted); text-align: center; padding: 26px 10px; }
  .footnote { color: var(--muted); font-size: 13px; text-align: center; margin-top: 18px; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand">Explorer <span>Quest</span></div>
    <button class="navlink" id="navBtn"></button>
  </div>
  <div id="app"></div>
</div>
<canvas id="confetti" hidden></canvas>

<script>
"use strict";

/* ================= helpers ================= */
const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const pick = arr => arr[rnd(0, arr.length - 1)];
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const sample = (arr, n) => shuffle(arr).slice(0, n);

/* typed-answer matching: normalize + Damerau-Levenshtein typo tolerance */
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
function dlev(a, b) {
  const m = a.length, n = b.length;
  if (Math.abs(m - n) > 3) return 99;
  const d = Array.from({ length: m + 1 }, (_, i) => Array.from({ length: n + 1 }, (_, j) => i === 0 ? j : j === 0 ? i : 0));
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) {
    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
  }
  return d[m][n];
}
function matchesTerm(user, term) {
  const u = norm(user);
  if (!u) return false;
  const targets = [term.t, ...(term.a || [])].map(norm);
  for (const t of targets) {
    if (u === t) return true;
    const allow = t.length >= 8 ? 2 : t.length >= 4 ? 1 : 0;
    if (allow && dlev(u, t) <= allow) return true;
  }
  return false;
}

/* ================= Lesson 1 — vocabulary (pg 80–85) ================= */
const VOCAB = [
  { t: "Merchant", a: ["merchants"],
    d: "A person who makes their living buying and selling goods.",
    n: "Merchants trade — they buy and sell to earn a living." },
  { t: "Navigation", a: ["navigate", "navigating"],
    d: "Finding your way from one place to another, on water or land.",
    n: "Navigate = find your way from point A to point B." },
  { t: "Enslaved", a: ["enslave", "enslavement"],
    d: "Forced to work with no pay and without the freedom to leave.",
    n: "No pay, no freedom to leave — forced." },
  { t: "Missionary", a: ["missionaries"],
    d: "A person who tries to persuade people to accept new religious beliefs.",
    n: "On a mission to spread their religion." },
  { t: "Ally", a: ["allies", "allie"],
    d: "A political and military partner.",
    n: "Partners who help each other — like the Spanish allying with some Native Americans." },
  { t: "Astrolabe", a: ["astrolab"],
    d: "A tool that measures the height of stars to find LATITUDE — north or south of the equator.",
    n: "Astro = stars. Stars → latitude (north–south)." },
  { t: "Orienteering compass", a: ["compass", "orienteering"],
    d: "Shows the direction of travel (N, E, S, W) — it helps sailors orient, or position, their ships.",
    n: "Compass = direction: north, east, south, west." },
  { t: "Sextant", a: ["sextent"],
    d: "A tool sailors used to find direction and LONGITUDE — east or west of the prime meridian.",
    n: "Sextant → longitude (east–west of the prime meridian)." },
  { t: "Silk Road", a: ["the silk road", "silkroad"],
    d: "Not a real road — a large network of sea and land trade routes.",
    n: "A whole web of trade routes, not one single road." },
  { t: "Caravel", a: ["caravels", "carvel"],
    d: "A ship with rectangular and triangular sails, room for cargo, and a flatter bottom — easier to steer.",
    n: "The explorers' ship: two kinds of sails, cargo room, flat bottom." },
  { t: "Conquistador", a: ["conquistadors", "conquistadore"],
    d: "A Spanish conqueror.",
    n: "Conquist- = conquer. Cortés and Pizarro were conquistadors." },
];

/* ================= Lesson 2 — Portuguese & Spanish (pg 86–91) ================= */
const L2FACTS = [
  { label: "Dias — around Africa's tip",
    why: "Dias was the first European around Africa's southern tip; da Gama later sailed all the way to India.",
    variants: [
      { q: "Bartolomeu Dias was the first European to sail around ___.",
        ans: { t: "Africa's southern tip", a: ["the southern tip of africa", "southern tip of africa", "africas tip", "the tip of africa", "south tip of africa"] },
        mc: ["India", "South America's southern tip", "the Atlantic Ocean"], typed: false },
      { q: "Who was the first European to sail around Africa's southern tip?",
        ans: { t: "Bartolomeu Dias", a: ["dias", "bartholomew dias", "bartolomeo dias"] },
        mc: ["Vasco de Gama", "Christopher Columbus", "Hernán Cortés"], typed: true },
    ]},
  { label: "Vasco de Gama — to India",
    why: "Vasco de Gama was the first to reach India by going around Africa.",
    variants: [
      { q: "Vasco de Gama was the first to sail to ___ by going around Africa.",
        ans: { t: "India", a: [] },
        mc: ["China", "Florida", "the Caribbean"], typed: true },
      { q: "Who was the first to sail to India by going around Africa?",
        ans: { t: "Vasco de Gama", a: ["da gama", "de gama", "vasco da gama", "gama"] },
        mc: ["Bartolomeu Dias", "Christopher Columbus", "Francisco Pizarro"], typed: true },
    ]},
  { label: "Columbus — the Taino",
    why: "Columbus and the Spanish met the Taino on islands of North America (the Caribbean).",
    variants: [
      { q: "Christopher Columbus and the Spanish encountered the ___ on islands of North America.",
        ans: { t: "Taino", a: ["tainos", "the taino"] },
        mc: ["Aztec", "Inca", "Powhatan"], typed: true },
      { q: "Which explorer's voyage first encountered the Taino?",
        ans: { t: "Christopher Columbus", a: ["columbus", "colombus", "cristopher columbus"] },
        mc: ["Hernán Cortés", "Francisco Pizarro", "Vasco de Gama"], typed: true },
    ]},
  { label: "Cortés — the Aztec",
    why: "Cortés and the Spanish found the Aztec in the central America area (Mexico).",
    variants: [
      { q: "Cortés and the Spanish encountered the ___ in the central America area.",
        ans: { t: "Aztec", a: ["aztecs", "the aztec", "aztec empire"] },
        mc: ["Taino", "Inca", "Iroquois"], typed: true },
      { q: "Which explorer captured the Aztec leader and demanded gold?",
        ans: { t: "Hernán Cortés", a: ["cortes", "hernan cortes", "cortez"] },
        mc: ["Francisco Pizarro", "Christopher Columbus", "Bartolomeu Dias"], typed: true },
    ]},
  { label: "Pizarro — the Inca",
    why: "Pizarro headed south and found the Inca Empire in South America.",
    variants: [
      { q: "Pizarro headed south and found the ___ Empire.",
        ans: { t: "Inca", a: ["incas", "the inca", "inka"] },
        mc: ["Aztec", "Taino", "Maya"], typed: true },
      { q: "Which explorer captured the Inca leader — and killed him even after a ransom was paid?",
        ans: { t: "Francisco Pizarro", a: ["pizarro", "pizzaro", "francisco pizzaro", "pisarro"] },
        mc: ["Hernán Cortés", "Christopher Columbus", "Vasco de Gama"], typed: true },
    ]},
  { label: "Effects — Columbus & the Taino",
    why: "Gifts at first — then the king and queen demanded more, and the Spanish brought diseases and violence to the Taino.",
    variants: [
      { q: "What were the effects of Columbus and the Taino interacting?",
        ans: { t: "They traded gifts at first — but the Spanish brought diseases and violence, and demanded more riches." },
        mc: ["The Taino sailed back to Spain and lived at the royal court.",
             "The two groups became equal trading partners for centuries.",
             "The Taino drove the Spanish away and were left alone."], typed: false },
    ]},
  { label: "Effects — Cortés & the Aztec",
    why: "The Aztec welcomed the Spanish, but Cortés captured their leader and demanded gold — the emperor was killed in the violence.",
    variants: [
      { q: "What were the effects of Cortés and the Aztec interacting?",
        ans: { t: "The Aztec welcomed them, but Cortés captured their leader and demanded gold — the emperor was killed." },
        mc: ["Cortés and the Aztec became lifelong allies and traded peacefully.",
             "The Aztec captured Cortés and he never returned to Spain.",
             "Cortés left without ever meeting the Aztec leader."], typed: false },
    ]},
  { label: "Effects — Pizarro & the Inca",
    why: "Pizarro captured the Inca leader, accepted a ransom of valuables — and killed him anyway.",
    variants: [
      { q: "What were the effects of Pizarro and the Inca interacting?",
        ans: { t: "Pizarro captured the Inca leader, accepted a ransom of valuables — then killed him anyway." },
        mc: ["The Inca defeated Pizarro and kept their empire for 200 more years.",
             "Pizarro and the Inca leader agreed to rule South America together.",
             "Pizarro traded peacefully and sailed home with spices."], typed: false },
    ]},
  { label: "Where the Spanish went",
    why: "Spanish exploration concentrated in South and Central America — plus what is now Florida.",
    variants: [
      { q: "The Spanish explorers primarily traveled to…",
        ans: { t: "South and Central America, and what is now Florida" },
        mc: ["North America's Atlantic coast and Canada",
             "Along the St. Lawrence River",
             "Around Africa to India and China"], typed: false },
    ]},
];

/* ================= Lesson 3 — English/French/Dutch (pg 92–97) ================= */
const L3FACTS = [
  { label: "New France — St. Lawrence & fur",
    why: "New France ran along the St. Lawrence River; its big resource was FUR.",
    variants: [
      { q: "The French established New France along the ___ River.",
        ans: { t: "St. Lawrence", a: ["saint lawrence", "st lawerence", "the st lawrence"] },
        mc: ["Hudson", "Mississippi", "James"], typed: true },
      { q: "The main resource found in New France was ___.",
        ans: { t: "fur", a: ["furs", "fur crops", "fur trade"] },
        mc: ["gold", "tobacco", "fish"], typed: true },
    ]},
  { label: "New England — Atlantic & fishing",
    why: "New England sat on the Atlantic coast; the main industry was FISHING.",
    variants: [
      { q: "New England was located along the coast of the ___.",
        ans: { t: "Atlantic Ocean", a: ["atlantic", "the atlantic", "atlantic coast"] },
        mc: ["Pacific Ocean", "Gulf of Mexico", "Hudson River"], typed: true },
      { q: "The main industry found in New England was ___.",
        ans: { t: "fishing", a: ["fish", "fisheries", "fishing industry"] },
        mc: ["fur trading", "gold mining", "tobacco farming"], typed: true },

/* ================= question builders ================= */
function vocabDistractors(term, fmt) {
  return sample(VOCAB.filter(x => x !== term), 3).map(fmt);
}
function mkVocabMC(term) {
  const label = "L1: " + term.t;
  if (Math.random() < 0.5) {
    return { kind: "mc", lesson: "Lesson 1 — Vocabulary", qterm: term.t, qsub: "Which definition matches?",
      o: [term.d, ...vocabDistractors(term, x => x.d)], why: term.n, missLabel: label, ansText: term.d };
  }
  return { kind: "mc", lesson: "Lesson 1 — Vocabulary", qtext: "“" + term.d + "”", qsub: "Which word is this?",
    o: [term.t, ...vocabDistractors(term, x => x.t)], why: term.n, missLabel: label, ansText: term.t };
}
function mkVocabTyped(term) {
  return { kind: "typed", lesson: "Lesson 1 — Vocabulary", qtext: "“" + term.d + "”", qsub: "Type the word:",
    tm: term, why: term.n, missLabel: "L1: " + term.t, ansText: term.t };
}
function mkFact(item, lessonName, lessonTag) {
  const v = pick(item.variants);
  const base = { lesson: lessonName, why: item.why, missLabel: lessonTag + ": " + item.label, ansText: v.ans.t };
  if (v.typed && Math.random() < 0.5) {
    return Object.assign(base, { kind: "typed", qtext: v.q, qsub: "Type the answer:", tm: v.ans });
  }
  return Object.assign(base, { kind: "mc", qtext: v.q, qsub: "Pick the answer:", o: [v.ans.t, ...v.mc] });
}
function mkMap(regionId) {
  const r = REGIONS[regionId];
  const base = { lesson: "The map (it's on the test!)", why: r.fact, missLabel: "Map: " + r.name, map: regionId };
  if (Math.random() < 0.5) {
    const pool = r.opts === "country" ? COUNTRY_OPTS : EXPLORER_OPTS;
    return Object.assign(base, { kind: "mc",
      qtext: r.opts === "country" ? "Which group settled or explored the highlighted area?" : "Which explorer is tied to the highlighted area?",
      qsub: "Look at the map.", o: [r.who, ...pool.filter(x => x !== r.who)], ansText: r.who });
  }
  const others = sample(REGION_IDS.filter(x => x !== regionId), 3).map(x => REGIONS[x].name);
  return Object.assign(base, { kind: "mc", qtext: "What was the highlighted area called?",
    qsub: "Look at the map.", o: [r.name, ...others], ansText: r.name });
}

function buildQuiz(scopeKey) {
  if (scopeKey === "l1") return shuffle(VOCAB.flatMap(t => [mkVocabMC(t), mkVocabTyped(t)]));
  if (scopeKey === "l2") return shuffle(L2FACTS.map(f => mkFact(f, "Lesson 2 — Spain & Portugal", "L2")));
  if (scopeKey === "l3") return shuffle([
    ...L3FACTS.map(f => mkFact(f, "Lesson 3 — France, England & the Dutch", "L3")),
    ...sample(REGION_IDS, 4).map(mkMap),
  ]);
  return shuffle([
    ...sample(VOCAB, 7).map(t => Math.random() < 0.5 ? mkVocabMC(t) : mkVocabTyped(t)),
    ...sample(L2FACTS, 6).map(f => mkFact(f, "Lesson 2 — Spain & Portugal", "L2")),
    ...sample(L3FACTS, 4).map(f => mkFact(f, "Lesson 3 — France, England & the Dutch", "L3")),
    ...sample(REGION_IDS, 3).map(mkMap),
  ]);
}
const SCOPES = {
  all: { label: "Full review" },
  l1:  { label: "Lesson 1 — Vocabulary" },
  l2:  { label: "Lesson 2 — Spain & Portugal" },
  l3:  { label: "Lesson 3 — France, England & Dutch" },
};
function scopeFromTotal(total) {
  if (total === 22) return "L1";
  if (total === 9) return "L2";
  if (total === 10) return "L3";
  if (total === 20) return "All";
  return "";
}

/* ================= storage (same pattern as the other apps) ================= */
const KEY = "explorer-quest-history";
const API = "/api/scores";
let apiSynced = false;

function loadLocal() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
}
function saveLocal(h) {
  try { localStorage.setItem(KEY, JSON.stringify(h)); } catch {}
}
function loadHistory() { return loadLocal(); }
function postRecord(rec) {
  return fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(rec) });
}
function addRecord(rec) {
  const h = loadLocal(); h.push(rec); saveLocal(h);
  postRecord(rec).catch(() => {});
}
function clearHistory() {
  saveLocal([]);
  if (apiSynced) fetch(API, { method: "DELETE" }).catch(() => {});
}
async function syncApi() {
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error();
    const server = await res.json();
    if (!Array.isArray(server)) throw new Error();
    const seen = new Set(server.map(r => r.id || r.date));
    const missing = loadLocal().filter(r => !seen.has(r.id || r.date));
    for (const r of missing) { try { await postRecord(r); } catch {} }
    const merged = server.concat(missing).sort((a, b) => String(a.date).localeCompare(String(b.date)));
    saveLocal(merged);
    apiSynced = true;
    if (state.screen === "home" || state.screen === "history") render();
  } catch { apiSynced = false; }
}

/* ================= state ================= */
const app = document.getElementById("app");
const navBtn = document.getElementById("navBtn");
let state = { screen: "home", quiz: [], idx: 0, right: 0, misses: [], locked: false, scopeLabel: "" };
let timers = [];
function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
function clearTimers() { timers.forEach(clearTimeout); timers = []; }

function go(screen) {
  clearTimers();
  state.screen = screen;
  if (screen === "home" || screen === "history") syncApi();
  render();
  window.scrollTo(0, 0);
}

navBtn.addEventListener("click", () => {
  if (state.screen === "quiz") {
    if (confirm("Quit this quiz? It won't be scored.")) go("home");
  } else if (state.screen === "home") {
    go("history");
  } else {
    go("home");
  }
});

function pctClass(p) { return p >= 90 ? "pct-good" : p >= 70 ? "pct-mid" : "pct-low"; }

function startQuiz(scopeKey) {
  state.quiz = buildQuiz(scopeKey);
  state.scopeLabel = SCOPES[scopeKey].label;
  state.idx = 0;
  state.right = 0;
  state.misses = [];
  go("quiz");
}

function render() {
  navBtn.textContent = state.screen === "quiz" ? "Quit" : state.screen === "home" ? "History" : "Home";
  if (state.screen === "home") renderHome();
  else if (state.screen === "quiz") renderQuiz();
  else if (state.screen === "results") renderResults();
  else if (state.screen === "study") renderStudy();
  else renderHistory();
}

function renderHome() {
  const h = loadHistory();
  const best = h.length ? Math.max(...h.map(r => r.percent)) : null;
  const avg = h.length ? Math.round(h.reduce((a, r) => a + r.percent, 0) / h.length) : null;
  app.innerHTML = `
    <div class="card hero">
      <h1>Set sail, Ava.</h1>
      <p>Unit 3 Exploration — <b>test Monday!</b> Vocabulary, the explorers, who settled where… and map questions, because the map is on the real test.</p>
      <div class="btn-row"><button class="btn btn-primary btn-wide" data-scope="all"><span class="stack">Full review — the whole unit<small>20 questions, a bit of everything</small></span></button></div>
      <div class="btn-row">
        <button class="btn" data-scope="l1"><span class="stack">Lesson 1<small>vocabulary · 22 Qs</small></span></button>
        <button class="btn" data-scope="l2"><span class="stack">Lesson 2<small>Spain &amp; Portugal · 9 Qs</small></span></button>
      </div>
      <div class="btn-row"><button class="btn btn-wide" data-scope="l3"><span class="stack">Lesson 3 — France, England &amp; the Dutch<small>includes map questions · 10 Qs</small></span></button></div>
      <div class="btn-row"><button class="btn btn-wide" id="studyBtn">Open the study guide + map</button></div>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="num mono">${h.length}</div><div class="lbl">Rounds</div></div>
      <div class="stat"><div class="num mono">${best === null ? "–" : best + "%"}</div><div class="lbl">Best</div></div>
      <div class="stat"><div class="num mono">${avg === null ? "–" : avg + "%"}</div><div class="lbl">Average</div></div>
    </div>`;
  app.querySelectorAll("[data-scope]").forEach(b => b.addEventListener("click", () => startQuiz(b.dataset.scope)));
  document.getElementById("studyBtn").addEventListener("click", () => go("study"));
}

function advance() {
  clearTimers();
  state.idx++;
  if (state.idx >= state.quiz.length) finishQuiz();
  else render();
}

function renderQuiz() {
  const q = state.quiz[state.idx];
  const n = state.quiz.length;

  let answerHTML;
  let opts = [];
  if (q.kind === "mc") {
    opts = shuffle(q.o.map((text, i) => ({ text, correct: i === 0 })));
    answerHTML = `<div class="opts">${opts.map((o, i) =>
      `<button class="opt" data-i="${i}">${esc(o.text)}</button>`).join("")}</div>`;
  } else {
    answerHTML = `<div class="answer-line">
        <input class="answer" id="ansInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type your answer" aria-label="type your answer">
        <button class="btn btn-primary" id="checkBtn">Check</button>
      </div>`;
  }

  app.innerHTML = `
    <div class="progress">
      <div class="label"><span>Question ${state.idx + 1} of ${n}</span><span>${esc(state.scopeLabel)}</span></div>
      <div class="bar"><div style="width:${((state.idx + 1) / n) * 100}%"></div></div>
    </div>
    <div class="card">
      <div class="qtopic">${esc(q.lesson)}</div>
      ${q.map ? `<div class="figbox">${mapSVG(q.map)}</div>` : ""}
      ${q.qterm ? `<div class="qterm">${esc(q.qterm)}</div>` : `<p class="qtext">${esc(q.qtext)}</p>`}
      <p class="qsub">${esc(q.qsub)}</p>
      ${answerHTML}
      <div class="feedback neutral" id="feedback">${q.kind === "mc" ? "Tap the best answer." : "Close spelling counts — just get the word out!"}</div>
    </div>`;

  const feedback = document.getElementById("feedback");
  const miss = aShown => state.misses.push({ q: q.missLabel, a: aShown, c: q.ansText });

  if (q.kind === "mc") {
    const showWhy = ok => {
      feedback.className = "feedback " + (ok ? "right" : "wrong");
      feedback.innerHTML = (ok ? "Correct! ✓" : `Not quite — the answer is <b>${esc(q.ansText)}</b>.`) +
        `<span class="why">${esc(q.why)}</span>` +
        (ok ? "" : ` <button class="navlink" id="nextBtn">Next →</button>`);
      if (!ok) document.getElementById("nextBtn").addEventListener("click", advance);
    };
    app.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.locked) return;
        state.locked = true;
        const chosen = opts[Number(btn.dataset.i)];
        app.querySelectorAll(".opt").forEach((b, i) => {
          b.disabled = true;
          if (opts[i].correct) b.classList.add("right");
          else if (b === btn) b.classList.add("wrong");
          else b.classList.add("dim");
        });
        if (chosen.correct) {
          state.right++;
          showWhy(true);
          later(() => { state.locked = false; advance(); }, 1600);
        } else {
          miss(chosen.text);
          showWhy(false);
          state.locked = false;
        }
      });
    });
  } else {
    const input = document.getElementById("ansInput");
    const checkBtn = document.getElementById("checkBtn");
    const submit = () => {
      if (state.locked) return;
      const raw = input.value.trim();
      if (!raw) { input.focus(); return; }
      state.locked = true;
      input.disabled = checkBtn.disabled = true;
      if (matchesTerm(raw, q.tm)) {
        state.right++;
        feedback.className = "feedback right";
        feedback.innerHTML = `Correct! ✓ <b>${esc(q.ansText)}</b><span class="why">${esc(q.why)}</span>
          <button class="navlink" id="nextBtn2" style="float:right">Next →</button>`;
        document.getElementById("nextBtn2").addEventListener("click", advance);
        later(() => { if (state.quiz[state.idx] === q) { state.locked = false; advance(); } }, 2000);
      } else {
        miss(raw);
        feedback.className = "feedback wrong";
        feedback.innerHTML = `Not quite — it's <b>${esc(q.ansText)}</b>.<span class="why">${esc(q.why)}</span>
          <button class="navlink" id="nextBtn">Next →</button>`;
        document.getElementById("nextBtn").addEventListener("click", advance);
      }
    };
    checkBtn.addEventListener("click", submit);
    input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  }
  state.locked = false;
}

function finishQuiz() {
  clearTimers();
  const total = state.quiz.length;
  const percent = Math.round((state.right / total) * 100);
  const rec = {
    id: Date.now() + "-" + Math.random().toString(36).slice(2, 8),
    date: new Date().toISOString(),
    right: state.right, total, percent,
    misses: state.misses.map(m => ({ q: String(m.q).slice(0, 190), a: String(m.a).slice(0, 70), c: String(m.c).slice(0, 110) })),
  };
  addRecord(rec);
  state.lastResult = rec;
  go("results");
}

function missListHTML(misses) {

    : `<div class="allgood">Nothing missed — a flawless voyage!</div>`;
}

function renderResults() {
  const r = state.lastResult;

    <div class="card score-hero">

function renderHistory() {
  const h = loadHistory().slice().reverse();
  const missCount = {};
  h.forEach(r => (r.misses || []).forEach(m => {
    const k = String(m.q);
    missCount[k] = (missCount[k] || 0) + 1;
  }));
  const worst = Object.entries(missCount).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const maxMiss = worst.length ? worst[0][1] : 1;

  const rows = h.map(r => {
    const d = new Date(r.date);
    const date = d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    const time = d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });

    return `<details class="hrow">
        <summary>

          ${sc ? `<span class="hscope">${sc}</span>` : ""}

          <span class="hpct ${pctClass(r.percent)}">${r.percent}%</span>
        </summary>
        <div class="hdetail">${missListHTML(r.misses || [])}</div>
      </details>`;
  }).join("");

  app.innerHTML = `
    <div class="card">
      <h2 style="font-size:22px">Round history</h2>
      <p style="color:var(--muted);font-size:14px;margin:6px 0 4px">Tap a round to see exactly what was missed.</p>
      ${h.length ? rows : `<div class="empty">No rounds yet — set sail on your first one!</div>`}
    </div>
    ${worst.length ? `<div class="card trouble"><h2 style="font-size:22px">Trouble spots</h2>
      <p style="color:var(--muted);font-size:14px;margin:6px 0 10px">Missed most often — drill these before Monday.</p>
      ${worst.map(([qq, nn]) =>
        `<div class="tlabel"><span style="max-width:75%">${esc(qq)}</span><span class="mono">${nn}×</span></div>
         <div class="tbar"><div style="width:${(nn / maxMiss) * 100}%"></div></div>`).join("")}</div>` : ""}
    <div class="btn-row"><button class="btn btn-primary btn-wide" id="startBtn">Full review</button></div>
    ${h.length ? `<div class="btn-row"><button class="btn btn-danger btn-wide" id="clearBtn">Clear history</button></div>` : ""}
    <p class="footnote">${apiSynced
      ? "Scores sync — open this same link on any phone or computer to see them."
      : "History is saved on this device."}</p>`;

  document.getElementById("startBtn").addEventListener("click", () => startQuiz("all"));
  const clearBtn = document.getElementById("clearBtn");
  if (clearBtn) clearBtn.addEventListener("click", () => {
    if (confirm("Delete all saved scores? This can't be undone.")) { clearHistory(); render(); }
  });
}

/* ================= confetti ================= */
function confetti() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("confetti");
  cv.hidden = false;
  cv.width = innerWidth; cv.height = innerHeight;
  const ctx = cv.getContext("2d");
  const colors = ["#0369A1", "#4FB6E8", "#1E8A4C", "#D97706", "#E05EA8"];
  const bits = Array.from({ length: 120 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.5,
    vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2,
    s: 5 + Math.random() * 6, r: Math.random() * Math.PI, vr: -0.1 + Math.random() * 0.2,
    col: colors[Math.floor(Math.random() * colors.length)],
  }));
  let frames = 0;
  (function loop() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const b of bits) {
      b.x += b.vx; b.y += b.vy; b.r += b.vr;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);
      ctx.fillStyle = b.col; ctx.fillRect(-b.s / 2, -b.s / 2, b.s, b.s * 0.6);
      ctx.restore();
    }
    if (++frames < 220) requestAnimationFrame(loop);
    else { ctx.clearRect(0, 0, cv.width, cv.height); cv.hidden = true; }
  })();
}
